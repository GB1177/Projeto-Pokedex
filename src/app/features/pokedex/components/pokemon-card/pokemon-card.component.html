<article class="pokemon-card">
  <div class="pokemon-card__meta">
    <span class="pokemon-card__type" [ngClass]="typeClass">{{ pokemon.type }}</span>
    <span class="pokemon-card__number">{{ pokemon.number }}</span>
  </div>

  @if (pokemon.imageUrl) {
    <img class="pokemon-card__image" [src]="pokemon.imageUrl" [alt]="pokemon.name" />
  } @else {
    <div class="pokemon-card__image pokemon-card__image--empty" aria-hidden="true"></div>
  }

  <h2>{{ pokemon.name }}</h2>
</article>
